apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "envoy-sidecar-demo.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "envoy-sidecar-demo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "envoy-sidecar-demo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/envoy-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "envoy-sidecar-demo.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        # -------------------------------------------------------
        # 메인 애플리케이션 컨테이너
        # -------------------------------------------------------
        - name: {{ .Values.app.name }}
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http-app
              containerPort: {{ .Values.app.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http-app
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http-app
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}

        # -------------------------------------------------------
        # Envoy Proxy Sidecar 컨테이너
        # -------------------------------------------------------
        - name: envoy
          image: "{{ .Values.envoy.image.repository }}:{{ .Values.envoy.image.tag }}"
          imagePullPolicy: {{ .Values.envoy.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - "-c"
            - "/etc/envoy/envoy.yaml"
            - "--log-level"
            - "info"
          ports:
            - name: http-envoy
              containerPort: {{ .Values.envoy.listenerPort }}
              protocol: TCP
            - name: envoy-admin
              containerPort: {{ .Values.envoy.adminPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ready
              port: envoy-admin
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: envoy-admin
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
          resources:
            {{- toYaml .Values.envoy.resources | nindent 12 }}

      volumes:
        - name: envoy-config
          configMap:
            name: {{ include "envoy-sidecar-demo.fullname" . }}-envoy-config

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
