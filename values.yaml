namespace: envoy-demo

replicaCount: 1

# 메인 애플리케이션 (demo용 nginx)
app:
  name: demo-app
  image:
    repository: nginx
    tag: "1.25-alpine"
    pullPolicy: IfNotPresent
  port: 80
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

# Envoy Sidecar 설정
envoy:
  image:
    repository: envoyproxy/envoy
    tag: "v1.29-latest"
    pullPolicy: IfNotPresent
  # 외부 트래픽을 받는 포트 (Envoy가 listen)
  listenerPort: 10000
  # Envoy admin 포트
  adminPort: 9901
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

# Service 설정
# type: ClusterIP → 클러스터 내부만 접근. 노드 IP로 접근하려면 NodePort 로 변경
service:
  type: NodePort
  port: 80
  targetPort: 10000
  adminPort: 9901
  # type 이 NodePort 일 때 사용 (미지정 시 클러스터가 포트 자동 할당)
  nodePortHttp: null   # 예: 30080
  nodePortAdmin: null  # 예: 30901

# Ingress (선택)
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: envoy-demo.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Envoy 설정
envoyConfig:
  admin:
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 9901
  listenerAddress: 0.0.0.0
  upstreamHost: 127.0.0.1
  upstreamPort: 80
  accessLog: true
