apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v19

  dataDirHostPath: /var/lib/rook

  mon:
    count: 3

  dashboard:
    enabled: true

  storage:
    useAllNodes: true
    useAllDevices: true

    nodes:
      - name: worker1
        devices:
          - name: "nvme0n2"
      - name: worker2
        devices:
          - name: "nvme0n2"
      - name: worker3
        devices:
          - name: "nvme0n2"
