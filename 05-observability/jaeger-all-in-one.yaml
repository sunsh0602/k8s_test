# Jaeger all-in-one (개발/테스트용, 단일 Pod)
# MetalLB로 External IP 할당 → MacBook: http://<EXTERNAL-IP>:16686 (Jaeger UI)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: tracing
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.52
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 5775   # accept zipkin.thrift over compact thrift protocol
            - containerPort: 6831  # accept jaeger.thrift over compact thrift protocol
            - containerPort: 6832  # accept jaeger.thrift over binary thrift protocol
            - containerPort: 5778   # serve configs
            - containerPort: 16686 # serve frontend (Jaeger UI)
            - containerPort: 14268 # accept jaeger.thrift directly from clients
            - containerPort: 14250 # accept model protobuf
            - containerPort: 9411  # Zipkin compatible
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: tracing
  labels:
    app: jaeger
spec:
  type: LoadBalancer
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: collector
      port: 14268
      targetPort: 14268
