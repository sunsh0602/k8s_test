# Prometheus — 클러스터 스크랩 후 Mimir로 remote_write (로컬 장기 보관 최소화)
# chart: prometheus-community/prometheus
alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi

server:
  global:
    scrape_interval: 30s
    scrape_timeout: 10s
  retention: 3d
  remoteWrite:
    - url: http://mimir-gateway.monitoring.svc/api/v1/push
      queue_config:
        capacity: 10000
        max_shards: 5
        min_shards: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1536Mi
  persistentVolume:
    enabled: true
    size: 8Gi
