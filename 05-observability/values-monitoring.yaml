# MacBook + VMware Fusion 환경용: 리소스 절감 + Grafana LoadBalancer
# 사용: helm install ... -f values-monitoring.yaml

# Grafana: MetalLB로 External IP 부여 → MacBook에서 접속
grafana:
  enabled: true
  adminPassword: admin
  service:
    type: LoadBalancer
    port: 80

# Prometheus 리소스 절감 (VM 메모리 부족 방지)
prometheus:
  prometheusSpec:
    resources:
      requests:
        memory: 400Mi
        cpu: 100m
      limits:
        memory: 800Mi
        cpu: 500m
    retention: 5d

# Alertmanager 리소스 절감
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        memory: 32Mi
        cpu: 10m
      limits:
        memory: 128Mi
        cpu: 100m

# node-exporter: 데몬셋, 리소스 소량
prometheus-node-exporter:
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 64Mi
      cpu: 100m

# kube-state-metrics 리소스 절감
kube-state-metrics:
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 128Mi
      cpu: 200m
